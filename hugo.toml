# Base URL used when generating links to your pages
# Set to the URL for your site
baseURL = "https://saurabh-kumar.com"

# The name of this wonderful theme ;-).
theme = 'hugo-bearblog'

# Basic metadata configuration for your blog.
title = "Saurabh Kumar"
author = "Saurabh Kumar"
copyright = "Copyright © 2025, Saurabh Kumar."
locale = "en-US"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Keep tag names as written ("macos", not "Macos") in page titles.
capitalizeListTitles = false

# One taxonomy, shared by Writing posts and TIL notes.
[taxonomies]
tag = "tags"
# Ordered threads of notes and posts; content/series/<slug>/_index.md holds the title.
series = "series"

[permalinks.page]
blog = "/articles/:year/:month/:slug/"

# Tag pages lived at /articles/<tag>/ until Oct 2026;
# layouts/partials/tags/legacy-redirects.html keeps those URLs working.
[permalinks.term]
tags = "/tags/:slug/"
series = "/series/:slug/"

# TIL's feed lives at /til/rss.xml, as before the move into Hugo.
[outputFormats.tilrss]
mediaType = "application/rss+xml"
baseName = "rss"
isPlainText = false
rel = "alternate"

# Each page also has a Markdown copy at <page URL>index.md, for readers
# who paste pages into an LLM and for agents
# (layouts/_default/single.markdown.md). /llms.txt lists them
# (layouts/index.llms.txt).
[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
rel = "alternate"

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
page = ["html", "markdown"]
home = ["html", "rss", "llms"]

[[menus.main]]
name = "Writing"
url = "/"
weight = 1
# Posts live under /articles/; keep Writing active there.
[menus.main.params]
match = "/articles/"

[[menus.main]]
name = "Projects"
url = "/projects/"
weight = 2

[[menus.main]]
name = "TIL"
url = "/til/"
weight = 3

[[menus.main]]
name = "Now"
url = "/now/"
weight = 4

[[menus.main]]
name = "About"
url = "/about/"
weight = 5



[params]
# The "description" of your website. This is used in the meta data of your generated html.
description = "Saurabh Kumar writes about AI agents and research, backend systems, and building products."
enablePostNavigator = false

# Show the floating table of contents by default on pages that have headings.
# Individual pages can opt out with `toc = false` in their front matter.
# (The TOC partial itself only renders when the page actually has headings.)
toc = true


# These "images" are used for the structured data templates. This will show up, when
# services like Twitter or Slack want to generate a preview of a link to your site.
# See https://gohugo.io/templates/internal#twitter-cards and
# https://gohugo.io/templates/internal#open-graph.
images = ["/images/og.png"]

# Another "title" :-). This one is used as the site_name on the Hugo's internal
# opengraph structured data template.
# See https://ogp.me/ and https://gohugo.io/templates/internal#open-graph.
title = "Saurabh Kumar's Personal Site"

# This theme will, by default, inject a made-with-line at the bottom of the page.
# You can turn it off, but we would really appreciate if you don’t :-).
# hideMadeWithLine = true

# By default, this theme displays dates with a format like "02 Jan, 2006", but
# you can customize it by setting the `dateFormat` param in your site's config
# file. See [Hugo's Format function docs](https://gohugo.io/functions/format/)
# for details. An example TOML config that uses [ISO
# 8601](https://en.wikipedia.org/wiki/ISO_8601) format:
# dateFormat = "2006-01-02"
# Dates read "Oct 28, 2026" everywhere; lists grouped by year show "Oct 28".
dateFormat = "Jan 2, 2006"

# Linked from each TIL note's "Discuss" link (front matter `mastodon` = status ID).
mastodon = "https://mastodon.social/@theskumar"

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true
