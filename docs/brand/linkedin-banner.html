<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=block" rel="stylesheet">
<style>
/* LinkedIn profile banner, 1584x396. Brand: docs/brand/BRAND.md.
   LinkedIn's avatar covers roughly x 130-460 of the bottom 200 px, so type sits
   top-right and the drawing carries the bottom edge. */
*{box-sizing:border-box}html,body{margin:0}
body{width:1584px;height:396px;background:#F7F4ED;color:#1D1810;position:relative;overflow:hidden;
 background-image:linear-gradient(rgba(30,25,16,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(30,25,16,.04) 1px,transparent 1px);background-size:50px 50px}
canvas{position:absolute;inset:0}
.tick{position:absolute;width:18px;height:18px;border-color:#1D1810;border-style:solid;opacity:.7}
.tl{top:26px;left:26px;border-width:2px 0 0 2px}.br{bottom:26px;right:26px;border-width:0 2px 2px 0}
.copy{position:absolute;left:620px;right:96px;top:58px}
.row{display:flex;align-items:center;gap:18px;font:500 17px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#7C7462}
.row i{flex:1;height:1px;background:rgba(30,25,16,.18)}
.row .acc{color:#B4491F}
h1{margin:20px 0 0;font:500 44px/1.12 'Newsreader',serif;letter-spacing:-.018em;text-wrap:balance}
body.quiet .copy{display:none}
</style></head><body>
<canvas id="c" width="3168" height="792" style="width:1584px;height:396px"></canvas>
<span class="tick tl"></span><span class="tick br"></span>
<div class="copy">
  <div class="row"><span class="acc">Principal Engineer, Fueled</span><i></i><span>saurabh-kumar.com</span></div>
  <h1>I build AI systems, study how agents do real work, and figure out what's worth building.</h1>
</div>
<script>
if (location.hash === '#quiet') document.body.classList.add('quiet');
const c = document.getElementById('c'), x = c.getContext('2d'); x.scale(2, 2);
// Deterministic value noise.
const h = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
const n = (u, v) => { const i = Math.floor(u), j = Math.floor(v), f = u - i, g = v - j, a = f*f*(3-2*f), b = g*g*(3-2*g);
  return ((h(i,j)*(1-a)+h(i+1,j)*a)*(1-b)+(h(i,j+1)*(1-a)+h(i+1,j+1)*a)*b)*2-1; };
const ease = t => t*t*(3-2*t);
const W = 1584, LINES = 7;
// Two hills on the right, as in the mark: a small front hill and a taller
// back hill. Back lines carry the full height; front lines relax into swells.
const bump = (px, c, w, ht) => ht * Math.pow(Math.max(0, 1 - Math.abs(px - c) / w), 1.35);
for (let k = 0; k < LINES; k++) {
  const base = 286 + k * 15, front = k === LINES - 1, lift = Math.pow(1 - k / LINES, 1.6);
  x.beginPath();
  for (let px = -10; px <= W + 10; px += 2) {
    const t = ease(Math.min(1, Math.max(0, (px - 560) / 560)));   // 0: sea (left), 1: hills (right)
    const swell = Math.sin(px / 44 + k * 0.9) * 3.5 + n(px / 130, k * 3.1) * 5;
    const hills = bump(px, 1190, 210, 50) + bump(px, 1430, 250, 78) + n(px / 38, k * 1.3) * 3.5;
    const y = base + swell * (1 - t) - hills * lift;
    px < -9 ? x.moveTo(px, y) : x.lineTo(px, y);
  }
  x.strokeStyle = front ? 'rgba(29,24,16,.55)' : `rgba(124,116,98,${0.26 + k * 0.045})`;
  x.lineWidth = front ? 1.6 : 1.15;
  x.stroke();
}
// Ember sun over the sea.
x.beginPath(); x.arc(520, 226, 8, 0, Math.PI * 2); x.fillStyle = '#B4491F'; x.fill();
</script></body></html>
