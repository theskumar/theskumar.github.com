{{ define "main" }}
<div class="page-head reveal">
  <h1>Writing</h1>
  {{ with .Content }}<div class="sub">{{ . }}</div>{{ end }}
</div>

<ul class="blog-posts reveal">
  {{ range (where .Site.RegularPages "Section" "blog").ByDate.Reverse }}
  {{ partial "post-entry.html" . }}
  {{ else }}
  <li class="entry">No posts yet.</li>
  {{ end }}
</ul>
{{ end }}
