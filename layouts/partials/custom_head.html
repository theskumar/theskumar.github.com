<!-- Browser UI (mobile Safari address bar) tint. Values match --bg; updated on toggle. -->
<meta name="theme-color" content="#FBFBFA">
<script>
  (function () {
    var el = document.documentElement;
    el.classList.add('js');
    // Resolve theme before first paint so colors and the toggle icon never flash.
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = (stored === 'dark' || stored === 'light') ? stored : (prefersDark ? 'dark' : 'light');
    el.setAttribute('data-theme', theme);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#1A1917' : '#FBFBFA');

    // When arriving via a cross-document view transition, let the page cross-fade be the
    // only entrance animation. Otherwise pages with .reveal content (home/about/list) would
    // fade in twice and look different from pages without it (now/projects).
    window.addEventListener('pagereveal', function (e) {
      if (e && e.viewTransition) el.classList.add('vt-nav');
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
