<script>
  /* Scroll reveal. */
  (function () {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  })();

  /* Stagger: children of [data-stagger] cascade in with per-item delays. */
  (function () {
    document.querySelectorAll('[data-stagger]').forEach(function (parent) {
      Array.prototype.forEach.call(parent.children, function (child, i) {
        child.style.setProperty('--index', i);
      });
    });
  })();

  /* Schematic draw-on: measure each edge, hand the length to CSS, then flip
     the switch. Signals and labels follow via transition delays. */
  (function () {
    var fig = document.querySelector('.schematic');
    if (!fig) return;
    fig.querySelectorAll('.edge:not(.edge--dashed)').forEach(function (path) {
      path.style.setProperty('--len', path.getTotalLength().toFixed(1));
    });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { fig.classList.add('is-drawn'); });
    });
  })();

  /* Reading progress hairline on long-form posts. */
  (function () {
    var prose = document.querySelector('article.post content[data-prose]');
    if (!prose) return;
    var bar = document.createElement('div');
    bar.className = 'read-progress';
    bar.setAttribute('aria-hidden', 'true');
    document.body.appendChild(bar);
    var ticking = false;
    function update() {
      ticking = false;
      var doc = document.documentElement;
      var max = doc.scrollHeight - window.innerHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    update();
  })();
</script>
