<script>
  /* Scroll reveal. */
  (function () {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  })();

  /* Stagger: children of [data-stagger] cascade in with per-item delays. */
  (function () {
    document.querySelectorAll('[data-stagger]').forEach(function (parent) {
      Array.prototype.forEach.call(parent.children, function (child, i) {
        child.style.setProperty('--index', i);
      });
    });
  })();

  /* Reading progress hairline on long-form posts. */
  (function () {
    var prose = document.querySelector('article.post content[data-prose]');
    if (!prose) return;
    var bar = document.createElement('div');
    bar.className = 'read-progress';
    bar.setAttribute('aria-hidden', 'true');
    document.body.appendChild(bar);
    var ticking = false;
    function update() {
      ticking = false;
      var doc = document.documentElement;
      var max = doc.scrollHeight - window.innerHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    update();
  })();
</script>

<script type="module">
  /* The tattoo: hills into ocean. Three canvases share one noise field —
     #fx-hills crests at the very top of the browser, #fx-waves laps at the
     very bottom, and on the home page #fx-field fills the viewport with
     ridgelines that relax into swells as you scroll. simplex-noise does the
     organic work; a value-noise shim covers offline builds. Everything is
     theme-aware, 30fps-capped, paused offscreen, static under reduced motion. */
  let createNoise2D;
  try {
    ({ createNoise2D } = await import('https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/dist/esm/simplex-noise.min.js'));
  } catch (e) {
    createNoise2D = function () {
      function h(ix, iy) { const s = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453; return s - Math.floor(s); }
      return function (x, y) {
        const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
        const a = h(ix, iy), b = h(ix + 1, iy), c = h(ix, iy + 1), d = h(ix + 1, iy + 1);
        return ((a * (1 - ux) + b * ux) * (1 - uy) + (c * (1 - ux) + d * ux) * uy) * 2 - 1;
      };
    };
  }
  const n2 = createNoise2D();

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ease = (u) => u * u * (3 - 2 * u);
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const accent = () =>
    document.documentElement.getAttribute('data-theme') === 'dark' ? '#E08B54' : '#B4491F';
  const paper = () => getComputedStyle(document.documentElement).backgroundColor;

  function scene(canvas, draw) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, ink = '#A59C87', rafId = null, visible = false, last = 0;
    function layout() {
      const r = canvas.getBoundingClientRect();
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ink = getComputedStyle(canvas).color || ink;
    }
    function frame(ts) {
      rafId = null;
      if (ts - last >= 33) { last = ts; draw(ctx, W, H, ts, ink); }
      if (visible && !reduce) rafId = requestAnimationFrame(frame);
    }
    const start = () => {
      if (reduce) { draw(ctx, W, H, 0, ink); return; }
      if (rafId == null) rafId = requestAnimationFrame(frame);
    };
    const stop = () => { if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; } };
    new IntersectionObserver((entries) => {
      visible = entries[0].isIntersecting;
      if (visible && !document.hidden) start(); else stop();
    }).observe(canvas);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop(); else if (visible) start();
    });
    window.addEventListener('resize', () => { layout(); if (reduce) draw(ctx, W, H, 0, ink); });
    new MutationObserver(() => {
      ink = getComputedStyle(canvas).color || ink;
      if (reduce) draw(ctx, W, H, 0, ink);
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    layout();
    draw(ctx, W, H, 0, ink); /* first frame synchronously; rAF may be throttled */
  }

  /* Ridge profile: folded noise, peaks up. Swell profile: smooth rollers. */
  const ridgeAt = (x, layer, tt, base, amp) =>
    base - Math.abs(n2(x * (0.0032 - layer * 0.0006) - tt * (0.35 + layer * 0.2), layer * 17.3)) * amp
         - n2(x * 0.02, layer * 5 + 40) * 2;
  const swellAt = (x, layer, t, tt, base, amp) =>
    base + n2(x * 0.0055 - tt * (0.5 + layer * 0.25), layer * 29.7) * amp
         + Math.sin(x * 0.016 - t * 0.0011 + layer * 1.9) * (1.6 + layer * 0.9);

  /* Hills: three occluding ridgelines hanging their peaks on the top edge. */
  scene(document.getElementById('fx-hills'), (ctx, W, H, t, ink) => {
    ctx.clearRect(0, 0, W, H);
    const tt = t * 0.00004;
    for (let i = 0; i < 3; i++) {
      const base = H * (0.42 + i * 0.24);
      const amp = H * (0.38 - i * 0.06);
      ctx.beginPath();
      for (let x = 0; x <= W; x += 5) {
        const y = ridgeAt(x, i, tt, base, amp);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.globalAlpha = 1; ctx.fillStyle = paper(); ctx.fill();
      ctx.globalAlpha = 0.26 + i * 0.14;
      ctx.strokeStyle = ink; ctx.lineWidth = 1;
      ctx.stroke();
    }
    /* A walker on the front ridge. */
    const sx = ((t * 0.01) % (W + 60)) - 30;
    if (sx >= 0 && sx <= W) {
      const sy = ridgeAt(sx, 2, tt, H * 0.9, H * 0.26);
      ctx.globalAlpha = 1; ctx.fillStyle = accent();
      ctx.beginPath(); ctx.arc(sx, sy - 3, 1.8, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });

  /* Waves: four occluding swells lapping at the bottom edge, plus a buoy. */
  scene(document.getElementById('fx-waves'), (ctx, W, H, t, ink) => {
    ctx.clearRect(0, 0, W, H);
    const tt = t * 0.00005;
    for (let i = 0; i < 4; i++) {
      const base = H * (0.34 + i * 0.19);
      const amp = 5 + i * 2.5;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 5) {
        const y = swellAt(x, i, t, tt, base, amp);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.globalAlpha = 1; ctx.fillStyle = paper(); ctx.fill();
      ctx.globalAlpha = 0.28 + i * 0.15;
      ctx.strokeStyle = ink; ctx.lineWidth = 1;
      ctx.stroke();
    }
    const sx = W - (((t * 0.008) % (W + 80)) - 40);
    if (sx >= 0 && sx <= W) {
      const sy = swellAt(sx, 1, t, tt, H * 0.53, 7.5);
      ctx.globalAlpha = 1; ctx.fillStyle = accent();
      ctx.beginPath(); ctx.arc(sx, sy - 3, 1.8, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  });

  /* Field (home only): the transformation itself. Lines near the top fold
     like ridges; scrolling — and simply sitting lower on the page — relaxes
     them into water. */
  scene(document.getElementById('fx-field'), (ctx, W, H, t, ink) => {
    ctx.clearRect(0, 0, W, H);
    const tt = t * 0.00003;
    const doc = document.documentElement;
    const scrollP = clamp01(window.scrollY / Math.max(1, doc.scrollHeight - window.innerHeight));
    const lines = 13;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1;
    for (let i = 0; i < lines; i++) {
      const v = i / (lines - 1);
      const u = ease(clamp01(v * 0.75 + scrollP * 0.55));
      const base = H * (0.06 + v * 0.9);
      ctx.globalAlpha = 0.07;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) {
        const fold = -Math.abs(n2(x * 0.0035 - tt * 0.4, i * 7.1)) * 30;
        const swell = n2(x * 0.005 - tt * 0.8, i * 11.7) * 10
                    + Math.sin(x * 0.015 - t * 0.0008 + i * 1.7) * 2.5;
        const y = base + fold * (1 - u) + swell * u;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
</script>
