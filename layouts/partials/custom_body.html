<script>
  (function () {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  })();

  /* Generative dot-wave: a procedural sine field rippling across a dotted grid.
     Theme-aware, DPR-aware, paused when offscreen/hidden, static under reduced motion. */
  (function () {
    var canvas = document.getElementById('fx-hero');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var color = 'rgb(154,59,46)';
    var W = 0, H = 0, dots = [], rafId = null, visible = false;

    function readColor() { color = getComputedStyle(canvas).color || color; }

    function layout() {
      var r = canvas.getBoundingClientRect();
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var spacing = W < 360 ? 34 : 30;
      var cols = Math.ceil(W / spacing) + 1, rows = Math.ceil(H / spacing) + 1;
      while (cols * rows > 700) { spacing += 4; cols = Math.ceil(W / spacing) + 1; rows = Math.ceil(H / spacing) + 1; }
      dots = [];
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) dots.push([x * spacing, y * spacing]);
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = color;
      for (var i = 0; i < dots.length; i++) {
        var dx = dots[i][0], dy = dots[i][1];
        var w = Math.sin(dx * 0.045 + dy * 0.05 + t * 0.0009);
        var n = (w + 1) / 2;
        ctx.globalAlpha = 0.05 + n * 0.33;
        ctx.beginPath();
        ctx.arc(dx, dy + w * 2.2, 0.5 + n * 1.7, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function frame(ts) { draw(ts); if (visible && !reduce) rafId = requestAnimationFrame(frame); }
    function start() { if (reduce) { draw(0); return; } if (rafId == null) rafId = requestAnimationFrame(frame); }
    function stop() { if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; } }

    readColor(); layout(); draw(0);

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        es.forEach(function (e) { visible = e.isIntersecting; if (visible) start(); else stop(); });
      }).observe(canvas);
    } else { visible = true; start(); }

    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if (visible) start(); });

    if ('MutationObserver' in window) {
      new MutationObserver(function () { readColor(); if (reduce) draw(0); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { dpr = Math.min(window.devicePixelRatio || 1, 2); layout(); draw(performance.now()); }, 200);
    });
  })();
</script>
