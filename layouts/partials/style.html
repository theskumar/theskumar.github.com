<style>
  :root {
      color-scheme: light dark;

      --width: 720px;
      --font-main: Verdana, sans-serif;
      --font-secondary: Verdana, sans-serif;
      --font-scale: 1em;

      --background-color:      light-dark(#fff,     #01242e);
      --heading-color:         light-dark(#222,     #eee);
      --text-color:            light-dark(#444,     #ddd);
      --link-color:            light-dark(#3273dc,  #8cc2dd);
      --visited-color:         #8b6fcb;
      --code-background-color: light-dark(#f2f2f2,  #303446);
      --code-color:            light-dark(#222,     #c6d0f5);
      --blockquote-color:      light-dark(#222,     #ccc);
  }

  [data-theme="light"] { color-scheme: light; }
  [data-theme="dark"]  { color-scheme: dark; }

  {{ partial "syntax-light.css" . | safeCSS }}

  @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
          {{ partial "syntax-dark.css" . | safeCSS }}
      }
  }
  html[data-theme="dark"] {
      {{ partial "syntax-dark.css" . | safeCSS }}
  }

  body {
      font-family: var(--font-secondary);
      font-size: var(--font-scale);
      margin: auto;
      padding: 20px;
      max-width: var(--width);
      text-align: left;
      background-color: var(--background-color);
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
      color: var(--text-color);
  }

  h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-main);
      color: var(--heading-color);
  }

  a {
      color: var(--link-color);
      cursor: pointer;
      text-decoration: none;
  }

  a:hover {
      text-decoration: underline;
  }

  nav a {
      margin-right: 8px;
  }

  strong, b {
      color: var(--heading-color);
  }

  button {
      margin: 0;
      cursor: pointer;
  }

  time {
   	font-family: monospace;
    	font-style: normal;
    	font-size: 15px;
  }

  main {
      line-height: 1.6;
  }

  table {
      width: 100%;
  }

  hr {
      border: 0;
      border-top: 1px dashed;
  }

  img {
      max-width: 100%;
  }

  p code, li code {
      font-family: monospace;
      padding: 2px 3px;
      background-color: var(--code-background-color);
      color: var(--code-color);
      border-radius: 3px;
  }

  blockquote {
      border-left: 1px solid #999;
      color: var(--code-color);
      padding-left: 20px;
      font-style: italic;
      margin-left: 0;
  }

  footer {
    margin-top: 1em;
  }

  .header-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
  }

  .theme-toggle {
      background: none;
      border: none;
      padding: 4px;
      color: var(--text-color);
      opacity: 0.7;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
  }

  .theme-toggle:hover {
      opacity: 1;
  }

  .title:hover {
      text-decoration: none;
  }

  .title h1 {
      font-size: 1.5em;
  }

  .inline {
      width: auto !important;
  }

  .code, .highlight pre {
      border-radius: 3px;
      margin-block-start: 1em;
      margin-block-end: 1em;
      overflow-x: auto;
      padding: 15px;
  }

  /* blog post list */
  ul.blog-posts {
      list-style-type: none;
      padding: unset;
  }

  ul.blog-posts li {
      display: flex;
  }

  ul.blog-posts li span {
      flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
      color: var(--visited-color);
  }
  .footnotes {
    font-size: calc(var(--font-scale) * 0.8);
  }
  .footnotes ol {
    padding-inline-start: 25px;
  }
  .footnotes ol p {
  margin-block: 0.2em;
  }
</style>
