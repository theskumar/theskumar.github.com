{{/* Tag chips of a note in a list.
     Context: dict "page" "exclude" (tag to leave out). */}}
{{ $tags := slice }}
{{ range .page.GetTerms "tags" }}{{ if ne .Data.Term $.exclude }}{{ $tags = $tags | append . }}{{ end }}{{ end }}
{{ with $tags }}
<div class="note-tags">
  {{- range . }}<a href="{{ .RelPermalink }}" class="tag">{{ .Data.Term }}</a>{{ end -}}
</div>
{{ end }}
