[[projects]]
name = "python-dotenv"
url = "https://github.com/theskumar/python-dotenv"
years = "2014–now"
theme = "tools"
kind = "oss"
one = "Loads environment variables from `.env` files."
short = "Written after a credentials leak. pydantic-settings and uvicorn depend on it."
role = "Author and co-maintainer"
outcome = "~580M downloads a month"
detail = '''
loads environment variables from `.env` files. I wrote it after credentials leaked from a codebase where I worked: secrets belong in the environment, not in git. It borrowed ideas from libraries around at the time, but I wanted something more focused that does one thing well, the Unix way. I think that's why it caught on: one `load_dotenv()` call and a file format with few surprises. It now gets about 580 million downloads a month, and libraries like pydantic-settings and uvicorn depend on it. I maintain it with Bertrand Bonnefoy-Claudet.'''

