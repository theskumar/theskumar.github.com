# Posts new TIL notes (content/til/<unix-ts>.md) to Mastodon, edits the toot
# when a posted note's text changes, commits the new status IDs, and then
# redeploys the site so the notes get their Discuss links.
name: Post TIL to Mastodon

on:
  push:
    branches: [main]
    paths: ["content/til/*.md"]

permissions:
  contents: write  # commit status IDs
  actions: write   # start the deploy workflow

# One run at a time, in push order: two runs racing could each post a note
# and only one would manage to push its ID.
concurrency:
  group: til-mastodon
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Pushes made with GITHUB_TOKEN don't start workflows; this guards against
    # a loop if the job ever pushes with a personal token instead.
    if: "!contains(github.event.head_commit.message, 'chore: record mastodon status IDs')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the script diffs the whole push

      - name: Post or edit toots
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          TIL_BASE: ${{ github.event.before }}
        run: python3 scripts/til-mastodon.py

      # Runs even if some notes failed, so IDs already written aren't lost
      # (a rerun would post those notes again).
      - name: Commit status IDs and redeploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/til
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record mastodon status IDs"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run hugo-deploy.yml --ref main
