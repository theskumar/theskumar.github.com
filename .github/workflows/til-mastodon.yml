# Posts new TIL notes (content/til/<unix-ts>.md) to Mastodon, edits the toot
# when a posted note changes, and commits the new status IDs.
name: Post TIL to Mastodon

on:
  push:
    branches: [main]
    paths: ["content/til/*.md"]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: add mastodon discuss link')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Post or edit toots
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python3 scripts/til-mastodon.py

      - name: Commit status IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/til
          if ! git diff --cached --quiet; then
            git commit -m "chore: add mastodon discuss link"
            git push
          fi
